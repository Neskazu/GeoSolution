name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:16-bullseye
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal --logger:"trx"
      - name: Debug — show files in workspace
        run: |
          find . -type f | grep -i release || echo "No Release files"
          find . -type f | grep -i TestResults || echo "No TestResults"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            !**/obj/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/

  quality:
    runs-on: ubuntu-latest
    container:
      image: node:16-bullseye
    needs: build
    steps:
      - name: Checkout code              
        uses: actions/checkout@v3

      - name: Setup .NET                  
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies      
        run: dotnet restore

      - name: Check code format
        run: dotnet format --verify-no-changes --no-restore
        continue-on-error: true  

      - name: Scan for vulnerable dependencies
        run: dotnet list package --vulnerable --include-transitive
        continue-on-error: true  

      - name: List outdated dependencies
        run: dotnet list package --outdated
        continue-on-error: true  

