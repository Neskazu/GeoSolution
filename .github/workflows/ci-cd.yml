name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --verbosity normal --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Debug — show all trx files
        run: |
          echo "Looking for .trx files..."
          find . -name '*.trx' -exec ls -lh {} \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: '**/bin/Release/'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

  quality:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code              
        uses: actions/checkout@v3

      - name: Setup .NET                  
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies      
        run: dotnet restore

      - name: Check code format
        run: dotnet format --verify-no-changes --no-restore
        continue-on-error: true  

      - name: Scan for vulnerable dependencies
        run: dotnet list package --vulnerable --include-transitive
        continue-on-error: true  

      - name: List outdated dependencies
        run: dotnet list package --outdated
        continue-on-error: true  
