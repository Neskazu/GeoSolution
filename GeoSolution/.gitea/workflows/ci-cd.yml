name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: gitea-runner
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Restore dependencies
        run: dotnet restore GeoSolution.csproj

      - name: Build
        run: dotnet build GeoSolution.csproj -c Release --no-restore

      - name: Test
        run: dotnet test GeoSolution.Tests/GeoSolution.Tests.csproj -c Release --no-build

  docker-build-and-push:
    needs: build-and-test
    runs-on: gitea-runner
    services:
      docker:
        image: docker:24-dind
        privileged: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login your.registry.com -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_CONFIGURATION=Release \
            -t your.registry.com/geo-solution:latest \
            -t your.registry.com/geo-solution:${{ github.run_number }} \
            -f Dockerfile .

      - name: Push Docker image
        run: |
          docker push your.registry.com/geo-solution:latest
          docker push your.registry.com/geo-solution:${{ github.run_number }}

  deploy:
    needs: docker-build-and-push
    runs-on: gitea-runner
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /srv/geo-app
            docker-compose pull
            docker-compose up -d --build geo-solution